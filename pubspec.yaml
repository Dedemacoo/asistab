name: asistab
description: "Yapay zeka destekli kisisel yasam yoneticisi."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  hooks_riverpod: ^2.4.9
  flutter_hooks: ^0.20.4
  go_router: ^12.1.1
  google_fonts: ^6.1.0
  lottie: ^3.0.0
  flutter_animate: ^4.2.0
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  firebase_storage: ^13.4.5
  firebase_messaging: ^16.4.3
  local_auth: ^2.1.8
  flutter_secure_storage: ^9.0.0
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.2
  dio: ^5.4.0
  table_calendar: ^3.0.9
  glassmorphism_ui: ^0.3.0
  connectivity_plus: ^5.0.2
  image_picker: ^1.1.2
  google_generative_ai: ^0.4.6
  google_sign_in: 6.2.2
  geolocator: ^14.0.2
  geocoding: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  isar_generator: ^3.1.0
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.jpg"
  web:
    generate: true
    image_path: "assets/images/app_icon.jpg"
    background_color: "#000000"

flutter_native_splash:
  color: "#000000"
  image: "assets/images/splash.jpg"
  android: true
  ios: true
  web: false
